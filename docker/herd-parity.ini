; ─────────────────────────────────────────────────────────────
;  herd-parity.ini — nilai yang HARUS sama di host (Herd)
;  dan di container (docker/php/php.ini).
;
;  Cara pasang di host:
;    1. Buka file (versi PHP Herd yang dipakai):
;         ~/Library/Application Support/Herd/config/php/84/php.ini
;         ~/Library/Application Support/Herd/config/php/85/php.ini
;    2. Tempel baris di bawah INI (timpa nilai lama kalau sudah ada).
;    3. Restart Herd / reload PHP:  herd restart
;    4. Cek hasilnya:               make parity
;
;  Catatan: Herd bisa menulis ulang php.ini saat update Herd atau
;  saat ganti versi PHP — ulangi langkah di atas kalau nilai kembali.
;
;  Kenapa penting: kalau upload_max_filesize host 10M sementara
;  container 40M, upload struk 15MB akan BERHASIL di Docker dan GAGAL
;  di Herd (atau sebaliknya). Itu sumber "kok beda?" yang klasik.
; ─────────────────────────────────────────────────────────────

memory_limit = 512M
upload_max_filesize = 40M
post_max_size = 48M
max_file_uploads = 25
max_execution_time = 300
max_input_time = 300

; Sama dengan container: Herd default 10M/10M -> dinaikkan di atas.
; Kalau salah satu nilai di ubah, ubah juga di docker/php/php.ini.
