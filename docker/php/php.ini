; ─────────────────────────────────────────────────────────────
;  php.ini tambahan untuk container SIAGA/BBM.
;  Nilai di bawah dipilih supaya SAMA dengan host (Herd).
;  Kalau salah satu diubah, samakan juga di:
;     ~/Library/Application Support/Herd/config/php/<versi>/php.ini
;  (lihat "faris/setup docker.md" → bagian Paritas).
; ─────────────────────────────────────────────────────────────

; ── Batas resource: HARUS sama dengan Herd ──
memory_limit = 512M
upload_max_filesize = 40M
post_max_size = 48M
max_file_uploads = 25
max_execution_time = 300
max_input_time = 300

; Herd memakai UTC dan mengandalkan APP_TIMEZONE=Asia/Jakarta dari Laravel.
date.timezone = UTC

; Herd menset pcre.jit=0; disamakan supaya perilaku regex panjang identik.
pcre.jit = 0

; Sama seperti Herd (default PHP), tapi ditulis eksplisit sebagai dokumentasi.
output_buffering = 4096
variables_order = "EGPCS"

; ── Error handling (APP_DEBUG=true saat lokal) ──
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; ── OPcache: kode tidak berubah di dalam image, tapi biarkan
;    validate_timestamps hidup supaya mode development
;    (docker-compose.override.yml) tetap bisa edit file langsung.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; ── Realpath cache (banyak file Blade/vendor) ──
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ── Jangan bocorkan versi PHP di header ──
expose_php = Off

; ── Upload & session ──
file_uploads = On
session.gc_maxlifetime = 7200
