; ─────────────────────────────────────────────────────────────
;  Supervisor: menjalankan nginx + php-fpm dalam satu container.
;  Dipasang ke /etc/supervisor/conf.d/siaga.conf
;
;  Supervisor sendiri dijalankan lewat CMD di Dockerfile:
;    supervisord --nodaemon --logfile /dev/null ...
;  Kalau salah satu proses mati, supervisor me-restart-nya.
; ─────────────────────────────────────────────────────────────

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
startsecs=1
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=1
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
