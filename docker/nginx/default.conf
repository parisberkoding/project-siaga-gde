# ─────────────────────────────────────────────────────────────
#  nginx untuk container SIAGA/BBM.
#
#  Sengaja dibuat semirip mungkin dengan nginx milik Herd:
#    - SAPI php-fpm (bukan mod_php)
#    - front controller: try_files ... /index.php?$query_string
#    - client_max_body_size dibatasi sama dengan post_max_size PHP
#
#  Ini pengganti public/.htaccess (yang hanya dibaca Apache).
# ─────────────────────────────────────────────────────────────

# ── PENTING: port yang dilihat aplikasi ──────────────────────
# Laravel/Symfony membangun URL absolut (asset(), url(), redirect) dari
# SERVER_PORT. Di dalam container nginx mendengarkan port 80, sementara
# browser membuka port host (default 8080). Tanpa baris di bawah, halaman
# menghasilkan http://localhost/... (port hilang) -> CSS/JS gagal dimuat
# dan diblokir CSP karena dianggap origin berbeda -> tampilan rusak.
#
# Solusi: ambil port dari header Host yang dikirim browser
# (mis. "localhost:8080" -> 8080). Otomatis ikut berubah kalau
# DOCKER_APP_PORT diganti, tanpa mengubah kode aplikasi.
map $http_host $client_port {
    default         $server_port;
    "~*:([0-9]+)$"  $1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Samakan dengan post_max_size di docker/php/php.ini (48M).
    # Herd memakai 1024M + post_max_size PHP; di sini dibatasi agar
    # request kebesaran gagal dengan pesan yang konsisten di dua sisi.
    client_max_body_size 48M;

    server_tokens off;

    # ── Log ke stdout/stderr supaya ikut `docker compose logs` ──
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ── Front controller (padanan RewriteRule ^ index.php [L]) ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # ── Perbaikan URL absolut (penting!) ──────────────────
        # 1) Debian fastcgi_params men-set `HTTP_HOST $host;` = nama host
        #    TANPA port, sehingga Symfony/Laravel menghitung port dari
        #    header Host -> dianggap 80 -> asset()/url() menghasilkan
        #    http://localhost/... dan CSS/JS gagal dimuat.
        #    Kembalikan Host asli dari browser (termasuk port).
        fastcgi_param HTTP_HOST       $http_host;
        # 2) Cadangan bila header Host kosong (HTTP/1.0 dsb):
        #    SERVER_PORT = port yang dipakai browser, bukan port internal.
        fastcgi_param SERVER_PORT     $client_port;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── File statis: JANGAN pakai expires (cache lama).
    #    Tapi tanpa Cache-Control sama sekali, browser menebak sendiri lama
    #    cache dari Last-Modified -> CSS/JS lama tetap dipakai setelah deploy.
    #    `no-cache` = boleh disimpan, tapi wajib revalidasi (ETag -> 304). ──
    location ~* \.(?:css|js|mjs|json|map|jpg|jpeg|png|gif|ico|svg|webp|avif|bmp|woff|woff2|ttf|otf|eot|pdf|xml|txt|csv)$ {
        access_log off;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Sembunyikan file dotfile (padanan `location ~ /\.ht`) ──
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
