# ─────────────────────────────────────────────────────────────
#  SIAGA / BBM Project — Docker (self-contained, aman berdampingan
#  dengan DBngin (3306) & Herd (80/443)).
#
#  Jalankan:  docker compose up -d --build
#  Akses app: http://localhost:8080
#
#  Port host yang dipakai:
#    - App  : 8080  (Herd:80/443)
#    - MySQL: 3307  (DBngin:3306)
#
#  .env host TIDAK diubah — hanya di-mount read-only, dan nilai
#  koneksi DB/URL di-override lewat `environment` di bawah.
# ─────────────────────────────────────────────────────────────
name: bbm-project

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bbm-project-app
    container_name: bbm_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_PUBLIC_URL: http://localhost:8080

      # Override koneksi DB ke service `db` (internal 3306, bukan host)
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bbm
      DB_USERNAME: bbm
      DB_PASSWORD: bbm_secret

      SESSION_DRIVER: database
      SESSION_DOMAIN: localhost
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      # .env host (berisi APP_KEY & API key) di-mount read-only.
      - ./.env:/var/www/html/.env:ro
      # Storage persisten (upload struk, barcode, qr, cache, log).
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: bbm_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: bbm
      MYSQL_USER: bbm
      MYSQL_PASSWORD: bbm_secret
      MYSQL_ROOT_PASSWORD: root_secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── Opsional: scheduler (2 command terjadwal: lunch forecast & sync harga BBM) ──
  # Tidak ikut `up` default. Jalankan bila perlu:
  #   docker compose --profile scheduler up -d
  scheduler:
    image: bbm-project-app
    container_name: bbm_scheduler
    restart: unless-stopped
    profiles: ["scheduler"]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bbm
      DB_USERNAME: bbm
      DB_PASSWORD: bbm_secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

volumes:
  db_data:
  app_storage:
